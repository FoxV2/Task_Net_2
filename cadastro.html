<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskNet - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="login.html">TaskNet</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card p-4 shadow">
                    <h1 class="h4 text-center mb-4">Criar Conta</h1>
                    
                    <form id="form-cadastro" novalidate>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required aria-required="true" autocomplete="name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" required aria-required="true" autocomplete="email">
                        </div>
                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" required aria-required="true" autocomplete="new-password" minlength="4">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Já tem conta? <a href="login.html">Faça login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center">
        <div class="container">
            <p class="mb-1">Trabalho Final - Projeto Integrador III</p>
            <p class="mb-1 small">Gustavo de Souza Pinto, Quellin Alvienes Marques, Mailton Torbes Kessner, Caue Morais Madruga</p>
            <p class="mb-0 small">Polo Rosário do Sul – IFSul</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
